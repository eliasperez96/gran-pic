<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facturas Gran Pic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#F1F3F6; --bg2:#D5DBE3;
  --ink:#1D2430; --muted:#5D6776; --line:rgba(29,36,48,.12);
  --panel:#FFFFFF; --chip:#FFFFFF; --chip-on:#1D2430; --chip-on-ink:#FFFFFF;
  --sheet:#FFFFFF; --accent:#2E5FA8; --rowhover:rgba(46,95,168,.07);
  --paper:#FAF8F3; --paper-ink:#23252A; --paper-muted:#6E7178;
  --reflect:rgba(255,255,255,.35);
  --cw:220px; --ch:311px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#1E2838; --bg2:#0E131B;
    --ink:#E8ECF2; --muted:#9AA4B3; --line:rgba(232,236,242,.12);
    --panel:#18202C; --chip:#232D3D; --chip-on:#E8ECF2; --chip-on-ink:#151B25;
    --sheet:#1C2431; --accent:#8DB4F0; --rowhover:rgba(141,180,240,.08); --reflect:rgba(255,255,255,.14);
  }
}
:root[data-theme="dark"]{
  --bg1:#1E2838; --bg2:#0E131B;
  --ink:#E8ECF2; --muted:#9AA4B3; --line:rgba(232,236,242,.12);
  --panel:#18202C; --chip:#232D3D; --chip-on:#E8ECF2; --chip-on-ink:#151B25;
  --sheet:#1C2431; --accent:#8DB4F0; --rowhover:rgba(141,180,240,.08); --reflect:rgba(255,255,255,.14);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);background:var(--bg2);
  background-image:radial-gradient(130% 75% at 50% 30%,var(--bg1),var(--bg2));
  background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body.locked{overflow:hidden}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.btn{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font:600 .85rem/1 Manrope,system-ui,sans-serif;color:var(--ink);
  background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:9px 14px;
}
.btn:focus-visible,.seg button:focus-visible,tr.row:focus-visible,#stage:focus-visible,input[type=range]:focus-visible,.close:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{min-height:1.2em;margin:8px 0 0;font-size:.85rem;color:#B4462F}

.seg{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;font:600 .88rem/1 Manrope,system-ui,sans-serif;color:var(--muted);background:none;border:0;border-radius:9px;padding:10px 6px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.range{color:var(--muted);font-size:.85rem;margin:12px 2px 8px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl-scroll{overflow-x:auto}
table.sum{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sum th{text-align:right;font-size:.75rem;font-weight:600;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.sum th:first-child,.sum td:first-child{padding-left:14px}.sum th:first-child{text-align:left}
.sum th:last-child{padding-right:36px}.sum td:last-child{padding-right:12px}
.sum td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:.92rem;white-space:nowrap;vertical-align:middle}
.sum td:first-child{text-align:left;white-space:normal;width:100%}
.sum tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover{background:var(--rowhover)}
tr.total td{font-weight:800;font-size:1rem;background:var(--rowhover)}
.pname{display:flex;align-items:center;gap:8px;font-weight:600}
.pname i{flex:none;width:9px;height:9px;border-radius:50%}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:2px}
.go{color:var(--muted);font-weight:600;font-size:1.2rem;line-height:1}
.amt{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.amt b{display:block;font-weight:inherit}
.amt small{display:block;font-size:.75rem;font-weight:500;margin-top:3px}
tr.total .amt b{font-weight:800}
.pend{color:#B7791F}
.zero{color:var(--muted)}
.emptyrow td{text-align:center!important;color:var(--muted);padding:28px 12px}

details{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:.85rem}
summary{cursor:pointer;color:var(--ink);font-weight:600}
pre{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:.78rem;color:var(--ink)}

/* Visor */
.viewer{
  position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
  background:var(--bg2);background-image:radial-gradient(130% 75% at 50% 40%,var(--bg1),var(--bg2));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-y:auto;
}
.viewer.on{display:flex}
.vtop{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 4px;max-width:900px;width:100%;margin:0 auto}
.back{flex:none;font:600 .88rem/1 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer}
.vtitle{min-width:0}
.vtitle h2{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.vtitle p{margin:3px 0 0;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}

#stage{
  position:relative;flex:none;height:calc(var(--ch) * 1.55);margin-top:8px;
  perspective:900px;perspective-origin:50% 40%;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;
}
#stage.dragging{cursor:grabbing}
.track{position:absolute;left:50%;top:46%;transform-style:preserve-3d}
.card{
  position:absolute;width:var(--cw);height:var(--ch);
  margin-left:calc(var(--cw) / -2);margin-top:calc(var(--ch) / -2);
  -webkit-box-reflect:below 4px linear-gradient(transparent 70%,var(--reflect));
  will-change:transform;backface-visibility:hidden;
  font-size:calc(var(--cw) * .046);
}
.paper{
  position:absolute;inset:0;overflow:hidden;border-radius:2px;
  background-color:var(--paper);color:var(--paper-ink);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.28  0 0 0 0 0.25  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    linear-gradient(100deg,rgba(0,0,0,.035),transparent 12%,transparent 88%,rgba(0,0,0,.045));
  box-shadow:0 18px 40px rgba(0,0,0,.3);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  padding:1.3em 1.2em 1.1em;display:flex;flex-direction:column;
}
.paper img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.lh{display:flex;align-items:center;gap:.7em;padding-bottom:.8em;border-bottom:1px solid #2C2E33}
.lh i{flex:none;width:2.2em;height:2.2em;border-radius:50%;opacity:.85}
.lh b{display:block;font-size:1.12em;font-weight:700;line-height:1.15}
.lh small{display:block;font-size:.72em;color:var(--paper-muted);margin-top:.15em}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-top:.9em}
.dh .ft{font-size:1.25em;font-weight:700;letter-spacing:.04em}
.dh span:last-child{font-size:.8em;font-variant-numeric:tabular-nums}
.m2{display:flex;justify-content:space-between;font-size:.74em;color:var(--paper-muted);margin-top:.3em}
table.dl{width:100%;border-collapse:collapse;margin-top:.9em;font-size:.74em;font-variant-numeric:tabular-nums}
.dl th{text-align:left;font-weight:600;border-bottom:1px solid #2C2E33;padding:.3em 0}
.dl td{padding:.38em 0;border-bottom:1px dotted #C9C4B8}
.dl .n{text-align:right}
.dl td:first-child{max-width:9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tots{margin-top:auto;margin-left:auto;width:62%;font-size:.78em;font-variant-numeric:tabular-nums}
.tots div{display:flex;justify-content:space-between;padding:.18em 0}
.tots div:last-child{border-top:1.5px solid #2C2E33;margin-top:.25em;padding-top:.35em;font-weight:700;font-size:1.22em}
.stamp{
  position:absolute;left:1.2em;bottom:1.6em;transform:rotate(-11deg);
  font-family:Manrope,system-ui,sans-serif;font-size:.8em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border:2px solid currentColor;border-radius:4px;padding:.2em .5em;opacity:.78;
}
.st-pagada{color:#2F7D4A}.st-pendiente{color:#B7791F}.st-vencida{color:#B4352A}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;border-radius:2px}

.caption{text-align:center;padding:0 16px}
.caption .who{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
.caption .what{color:var(--muted);font-size:.88rem;margin-top:3px;font-variant-numeric:tabular-nums}
.scrub{display:block;width:min(420px,calc(100% - 32px));margin:14px auto 0;accent-color:var(--accent)}
.hint{text-align:center;color:var(--muted);font-size:.8rem;margin:10px 16px 16px}

/* Detalle */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(5,8,14,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:86vh;overflow-y:auto;
  background:var(--sheet);color:var(--ink);border-radius:18px 18px 0 0;
  padding:0 0 calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);
}
.sheet.on{transform:translateY(0)}
.sband{padding:18px 20px 16px;color:#fff;position:relative}
.sband .cat{font-size:.82rem;font-weight:600;opacity:.85}
.sband h2{margin:3px 0 0;font-size:1.3rem;font-weight:800;letter-spacing:-.01em;padding-right:76px}
.close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:8px 12px;font:600 .85rem/1 Manrope,system-ui,sans-serif;cursor:pointer}
.sbody{padding:16px 20px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;font-size:.9rem}
.kv span{display:block;color:var(--muted);font-size:.8rem}
.kv b{font-weight:700;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;margin-top:18px}
table.det{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.det th{text-align:left;color:var(--muted);font-weight:600;font-size:.78rem;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.det td{padding:9px 6px 9px 0;border-bottom:1px solid var(--line)}
.det .n{text-align:right}
.totals{margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:.92rem;font-variant-numeric:tabular-nums}
.totals .big{font-size:1.25rem;font-weight:800}
.sactions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.sactions .primary{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
a.btn{text-decoration:none}
.nolines{margin:1.2em 0 0;font-size:.68em;color:var(--paper-muted);word-break:break-all}
.note{margin:14px 0 0;color:var(--muted);font-size:.8rem;word-break:break-all}
@media (prefers-reduced-motion:reduce){.sheet,.backdrop{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Facturas</h1>
  </header>
  <p class="status" id="status" role="status">Cargando facturas…</p>

  <div class="seg" id="seg" role="radiogroup" aria-label="Periodo">
    <button role="radio" data-p="mes" aria-checked="false">Último mes</button>
    <button role="radio" data-p="trimestre" aria-checked="false">Últimos 3 meses</button>
    <button role="radio" data-p="anio" aria-checked="true">Este año</button>
    <button role="radio" data-p="todo" aria-checked="false">Todo</button>
  </div>
  <p class="range" id="range"></p>

  <div class="panel">
    <div class="tbl-scroll">
      <table class="sum">
        <thead><tr><th>Proveedor</th><th>Nº</th><th>Importe</th></tr></thead>
        <tbody id="sumBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="vtop">
    <button class="back" id="backBtn">‹ Resumen</button>
    <div class="vtitle"><h2 id="vTitle"></h2><p id="vSub"></p></div>
  </div>
  <div id="stage" tabindex="0" aria-label="Facturas. Usa las flechas para moverte y Enter para abrir.">
    <div class="track" id="track"></div>
  </div>
  <div class="caption" aria-live="polite">
    <div class="who" id="who"></div>
    <div class="what" id="what"></div>
  </div>
  <input type="range" class="scrub" id="scrub" min="0" max="0" step="1" value="0" aria-label="Recorrer facturas">
  <p class="hint">Desliza para pasar facturas. Toca la del centro para ver el detalle.</p>
</div>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle"></section>

<script>
// Visor de facturas de Gran Pic. Lee la pestaña Lista y el Maestro de proveedores del paquete de datos
// de la app (?paquete=1). Si el dashboard ya lo ha guardado en este móvil, lo usa al instante.
const API='https://script.google.com/macros/s/AKfycbxl0_5ACr0CevKCHZOkE2zWwdhVtDPGrp7V5TBG2g2UyhFhxo_ULdWesW-iFKE1hpo/exec';
const CACHE_KEY='granpic-paquete-v1';

const CATS = {
  comida:{label:'Comida',color:'#2F6F8F'},
  bebida:{label:'Bebida',color:'#6B3F7A'},
  otros:{label:'Otros gastos',color:'#6E7480'}
};
const catOf = c => CATS[c] || CATS.otros;

const today = (()=>{const d=new Date(); d.setHours(0,0,0,0); return d;})();
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => new Date(s+'T00:00:00');
const addDays = (d,n) => {const x=new Date(d); x.setDate(x.getDate()+n); return x;};

let ALL = [];

const eur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const m2 = new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = s => { const d=parse(s); return isNaN(d)? s : d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}).replace('.',''); };
const fmtNum = s => { const d=parse(s); return isNaN(d)? s : d.toLocaleDateString('es-ES'); };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

/* Datos */
function expandirTabla(t){
  if(!t||!t.cols) return [];
  return t.filas.map(f=>{const o={};t.cols.forEach((c,i)=>{o[c]=f[i];});return o;});
}
const n2 = v => { const x=parseFloat(v); return isNaN(x)?0:x; };

function cargarPaquete(p){
  const lista=expandirTabla(p.hojas['Lista']);
  const maestro=expandirTabla(p.hojas['Maestro Proveedores']);
  const cats={};
  maestro.forEach(r=>{
    const nombre=String(r['Nomenclatura Gran Pic']||'').trim().toLowerCase();
    const cat=String(r['Categoría (600)']||'').trim().toLowerCase();
    if(nombre) cats[nombre]=cat==='comida'?'comida':(cat==='bebida'?'bebida':'otros');
  });
  ALL=lista.filter(r=>r.Fecha&&r.Proveedor).map(r=>{
    const proveedor=String(r.Proveedor).trim();
    const ruta=String(r['Ruta en Drive']||'');
    const enlace=String(r['Enlace PDF']||'');
    return {
      proveedor,
      numero:String(r['Número Factura']||'Sin número'),
      fecha:String(r.Fecha).slice(0,10),
      categoria:cats[proveedor.toLowerCase()]||'otros',
      base:n2(r['Base Imponible (€)']),
      cuota:n2(r['IVA (€)']),
      total:n2(r['Total (€)']),
      rectificada:String(r.Estado||'').toLowerCase()==='rectificada',
      archivo:ruta.split('/').pop(),
      carpeta:ruta.split('/').slice(1,-1).join(' › '),
      pdf:/^https:\/\//.test(enlace)?enlace:''
    };
  });
  const gen=new Date(p.generado);
  $('status').style.color='var(--muted)';
  $('status').textContent=isNaN(gen)?'':`Datos actualizados a las ${gen.getHours()}:${String(gen.getMinutes()).padStart(2,'0')}`;
  renderSummary();
}

async function cargarDatos(){
  let cache=null;
  try{const s=localStorage.getItem(CACHE_KEY); cache=s?JSON.parse(s):null;}catch(e){}
  if(cache&&cache.hojas) cargarPaquete(cache);
  try{
    const p=await fetch(`${API}?paquete=1`).then(r=>r.json());
    if(!p||!p.hojas) throw new Error('paquete vacío');
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(p));}catch(e){}
    cargarPaquete(p);
  }catch(e){
    if(!ALL.length){
      $('status').style.color='#B4462F';
      $('status').textContent='No se han podido cargar las facturas. Comprueba la conexión y vuelve a abrir esta pestaña.';
    }
  }
}

/* Periodo y tabla resumen */
const PERIODS = {
  mes:{label:'Último mes',from:()=>addDays(today,-29)},
  trimestre:{label:'Últimos 3 meses',from:()=>addDays(today,-90)},
  anio:{label:'Este año',from:()=>new Date(today.getFullYear(),0,1)},
  todo:{label:'Todas las facturas',from:()=>null}
};
let period='anio';
const inPeriod = f => { const from=PERIODS[period].from(); const d=parse(f.fecha); return (!from||d>=from) && d<=today; };

$('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  period=b.dataset.p;
  [...$('seg').children].forEach(x=>x.setAttribute('aria-checked',String(x===b)));
  renderSummary();
});

function renderSummary(){
  const from=PERIODS[period].from();
  const rows=ALL.filter(inPeriod);
  const primera=rows.reduce((m,f)=>!m||f.fecha<m?f.fecha:m,'');
  $('range').textContent=from?`Del ${fmtDate(iso(from))} al ${fmtDate(iso(today))}`:(primera?`Desde el ${fmtDate(primera)}`:'');
  if(!rows.length){
    const ultima=ALL.reduce((m,f)=>f.fecha>m?f.fecha:m,'');
    $('sumBody').innerHTML=`<tr class="emptyrow"><td colspan="3">No hay facturas en este periodo.${ultima?` La última es del ${fmtDate(ultima)}.`:''}</td></tr>`;
    return;
  }
  const by=new Map();
  rows.forEach(f=>{
    if(!by.has(f.proveedor)) by.set(f.proveedor,{p:f.proveedor,cat:f.categoria,n:0,tot:0,base:0});
    const g=by.get(f.proveedor); g.n++; g.tot+=f.total; g.base+=f.base;
  });
  const groups=[...by.values()].sort((a,b)=>b.tot-a.tot);
  const T={n:rows.length,tot:groups.reduce((s,g)=>s+g.tot,0),base:groups.reduce((s,g)=>s+g.base,0)};
  const amt=(t,b)=>`<div class="amt"><div><b>${eur.format(t)}</b><small class="zero">${eur.format(b)} sin IVA</small></div><span class="go">›</span></div>`;
  $('sumBody').innerHTML =
    `<tr class="row total" tabindex="0" data-p=""><td>Total facturas</td><td>${T.n}</td><td>${amt(T.tot,T.base)}</td></tr>` +
    groups.map(g=>{const c=catOf(g.cat); return `<tr class="row" tabindex="0" data-p="${esc(g.p)}">
      <td><div class="pname"><i style="background:${c.color}"></i>${esc(g.p)}</div><div class="bar"><span style="width:${(T.tot?g.tot/T.tot*100:0).toFixed(1)}%;background:${c.color}"></span></div></td>
      <td>${g.n}</td><td>${amt(g.tot,g.base)}</td></tr>`;}).join('');
}
$('sumBody').addEventListener('click',e=>{const r=e.target.closest('tr.row'); if(r) openViewer(r.dataset.p);});
$('sumBody').addEventListener('keydown',e=>{const r=e.target.closest('tr.row'); if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openViewer(r.dataset.p);}});

/* Visor tipo carrusel */
const viewer=$('viewer'), stage=$('stage'), track=$('track'), scrub=$('scrub');
let scope='', list=[], cards=[], pos=0, target=0, raf=null, cw=220;

const tipoIva = f => f.base ? Math.round(f.cuota/f.base*100) : 0;

function cardHTML(f,i){
  const c=catOf(f.categoria);
  const tilt=((i*37)%11-5)*0.12;
  return `<div class="card" data-i="${i}">
    <div class="paper" style="transform:rotate(${tilt}deg)">
      <div class="lh"><i style="background:${c.color}"></i><div><b>${esc(f.proveedor)}</b><small>${esc(c.label)}</small></div></div>
      <div class="dh"><span class="ft">FACTURA</span><span>Nº ${esc(f.numero)}</span></div>
      <div class="m2"><span>Fecha ${fmtNum(f.fecha)}</span><span>Cliente: Gran Pic</span></div>
      <p class="nolines">${esc(f.archivo||'')}</p>
      <div class="tots">
        <div><span>Base</span><span>${m2.format(f.base)}</span></div>
        <div><span>IVA${f.base?' '+tipoIva(f)+'%':''}</span><span>${m2.format(f.cuota)}</span></div>
        <div><span>Total €</span><span>${m2.format(f.total)}</span></div>
      </div>
    </div>
    ${f.rectificada?'<div class="stamp st-vencida">Rectificada</div>':''}
    <div class="shade"></div>
  </div>`;
}

function openViewer(p){
  scope=p;
  list=ALL.filter(f=>inPeriod(f)&&(!p||f.proveedor===p)).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!list.length) return;
  const tot=list.reduce((s,f)=>s+f.total,0);
  $('vTitle').textContent=p||'Total facturas';
  $('vSub').textContent=`${PERIODS[period].label}: ${list.length} ${list.length===1?'factura':'facturas'}, ${eur.format(tot)}`;
  track.innerHTML=list.map(cardHTML).join('');
  cards=[...track.children];
  viewer.classList.add('on'); document.body.classList.add('locked');
  sizes();
  pos=target=list.length-1;
  scrub.max=Math.max(0,list.length-1); scrub.disabled=list.length<2;
  render(); updateCaption(); stage.focus({preventScroll:true});
}
function closeViewer(){
  viewer.classList.remove('on'); document.body.classList.remove('locked');
  if(raf){cancelAnimationFrame(raf);raf=null}
  renderSummary();
}
$('backBtn').onclick=closeViewer;

function sizes(){
  const w=stage.clientWidth||360, h=window.innerHeight||700;
  cw=Math.round(Math.min(240,Math.max(150,w*0.52),(h-260)/1.414/1.55));
  cw=Math.max(150,cw);
  document.documentElement.style.setProperty('--cw',cw+'px');
  document.documentElement.style.setProperty('--ch',Math.round(cw*1.414)+'px');
}
function render(){
  const sp=cw*0.28, gap=cw*0.6;
  cards.forEach((el,i)=>{
    const off=i-pos, ao=Math.abs(off);
    if(ao>7){el.style.display='none';return}
    el.style.display='';
    const a=Math.max(-1,Math.min(1,off));
    el.style.transform=`translate3d(${off*sp+a*gap}px,0,${-Math.abs(a)*170-Math.max(0,ao-1)*8}px) rotateY(${-a*60}deg)`;
    el.style.zIndex=String(1000-Math.round(ao*10));
    el.lastElementChild.style.opacity=String(Math.min(.45,ao*.14));
  });
}
function animate(){
  const d=target-pos;
  if(Math.abs(d)<0.002){pos=target;render();raf=null;return}
  pos+=d*0.16; render(); raf=requestAnimationFrame(animate);
}
function go(t){
  if(!list.length) return;
  target=Math.max(0,Math.min(list.length-1,Math.round(t)));
  updateCaption();
  if(reduceMotion){pos=target;render();return}
  if(!raf) raf=requestAnimationFrame(animate);
}
function updateCaption(){
  const f=list[target]; if(!f) return;
  $('who').textContent=f.proveedor;
  $('what').textContent=`${f.numero}, ${fmtDate(f.fecha)}. ${eur.format(f.total)}${f.rectificada?', rectificada':''}`;
  scrub.value=target;
}

let drag=null;
stage.addEventListener('pointerdown',e=>{
  if(!list.length) return;
  drag={x:e.clientX,start:pos,moved:false,card:e.target.closest('.card'),lastX:e.clientX,lastT:performance.now(),v:0};
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x;
  if(!drag.moved&&Math.abs(dx)>6){drag.moved=true;stage.classList.add('dragging');if(raf){cancelAnimationFrame(raf);raf=null}}
  if(!drag.moved) return;
  const sp=cw*0.28;
  pos=Math.max(-0.4,Math.min(list.length-0.6,drag.start-dx/sp));
  const now=performance.now(), dt=now-drag.lastT;
  if(dt>0){drag.v=-(e.clientX-drag.lastX)/sp/dt;drag.lastX=e.clientX;drag.lastT=now;}
  target=pos; render();
});
function endDrag(){
  if(!drag) return;
  stage.classList.remove('dragging');
  if(drag.moved) go(pos+drag.v*160);
  else if(drag.card){const i=+drag.card.dataset.i; if(i===target) openSheet(i); else go(i);}
  drag=null;
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
let wheelAcc=0;
stage.addEventListener('wheel',e=>{
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  e.preventDefault(); wheelAcc+=d;
  if(Math.abs(wheelAcc)>40){go(target+Math.sign(wheelAcc));wheelAcc=0;}
},{passive:false});
stage.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){go(target+1);e.preventDefault()}
  else if(e.key==='ArrowLeft'){go(target-1);e.preventDefault()}
  else if(e.key==='Home'){go(0);e.preventDefault()}
  else if(e.key==='End'){go(list.length-1);e.preventDefault()}
  else if(e.key==='Enter'||e.key===' '){openSheet(target);e.preventDefault()}
});
scrub.addEventListener('input',()=>go(+scrub.value));

/* Ficha de detalle */
const sheet=$('sheet'), backdrop=$('backdrop');
let sheetOpen=false;
function openSheet(i){
  const f=list[i]; if(!f) return;
  const c=catOf(f.categoria);
  sheet.innerHTML=`
    <div class="sband" style="background:${c.color}">
      <span class="cat">${esc(c.label)}</span><h2 id="sTitle">${esc(f.proveedor)}</h2>
      <button class="close" id="closeBtn">Cerrar</button>
    </div>
    <div class="sbody">
      <div class="kv">
        <div><span>Número</span><b>${esc(f.numero)}</b></div>
        <div><span>Fecha</span><b>${fmtDate(f.fecha)}</b></div>
        <div><span>Estado</span><b${f.rectificada?' class="st-vencida"':''}>${f.rectificada?'Rectificada':'Original'}</b></div>
        <div><span>Carpeta en Drive</span><b>${esc(f.carpeta||'—')}</b></div>
      </div>
      <div class="totals">
        <span>Base imponible</span><span>${eur.format(f.base)}</span>
        <span>IVA${f.base?' '+tipoIva(f)+' %':''}</span><span>${eur.format(f.cuota)}</span>
        <span class="big">Total</span><span class="big">${eur.format(f.total)}</span>
      </div>
      <p class="note">Archivo: ${esc(f.archivo||'—')}</p>
      ${f.pdf?`<div class="sactions"><a class="btn primary" id="pdfBtn" href="${esc(f.pdf)}" target="_blank" rel="noopener">Ver PDF original</a></div>`:''}
    </div>`;
  sheet.classList.add('on'); backdrop.classList.add('on'); sheetOpen=true;
  $('closeBtn').onclick=closeSheet;
  // Dentro de la app, el PDF se abre en su visor; si esta página se abre sola, va a Drive
  const pdfBtn=$('pdfBtn');
  if(pdfBtn&&window.parent!==window&&typeof window.parent.verPdf==='function'){
    pdfBtn.onclick=e=>{e.preventDefault();window.parent.verPdf(f.pdf,`${f.proveedor} · ${fmtNum(f.fecha)}`);};
  }
  $('closeBtn').focus();
}
function closeSheet(){sheet.classList.remove('on');backdrop.classList.remove('on');sheetOpen=false;stage.focus({preventScroll:true});}
backdrop.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(sheetOpen) closeSheet(); else if(viewer.classList.contains('on')) closeViewer();
});

window.addEventListener('resize',()=>{if(viewer.classList.contains('on')){sizes();render();}});
cargarDatos();
</script>
</body>
</html>
